services:
  app:
    container_name: vitrine2-app
    build:
      context: ..                   # <- repo root (contient /vitrine et /serveur)
      dockerfile: serveur/app/Dockerfile
    ports:
      - "${APP_HTTP_PORT:-8081}:80"
    env_file:
      - .env.compose                 # <== charge automatiquement APP_ENV, APP_DEBUG, etc.
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      MAILER_DSN: "smtp://mailer:1025"
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
      APP_RUNTIME_DISABLE_DOTENV: "1"
    volumes:
      - ../vitrine:/var/www/html:rw,delegated
      - app_var:/var/www/html/var
      - app_uploads:/var/www/html/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    container_name: vitrine2-mysql
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.compose
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    container_name: vitrine2-phpmyadmin
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "${PMA_HTTP_PORT:-8082}:80"
    env_file:
      - .env.compose
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 100M
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  db_data:
  app_var:
  app_uploads:
